# Include from the CLIENT repo .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/RootingLabs/scan-action/v1/gitlab/rootinglabs.gitlab-ci.yml'
#
# Set CI/CD variables: ROOTINGLABS_TOKEN (masked) and RL_TARGET.
#
# NOTE ON SARIF vs GitLab SAST:
#   GitHub ingests SARIF natively. GitLab's `artifacts:reports:sast` expects
#   GitLab's own security-report schema, NOT SARIF, so we do NOT mislabel the
#   SARIF as a sast report (that would silently fail to parse). Here the SARIF is
#   published as a downloadable artifact and the job gates the pipeline on
#   severity. Native MR-widget integration needs a SARIF -> GitLab-SAST
#   converter (tracked as a follow-up).
rootinglabs-pentest:
  image: alpine:3.20
  variables:
    RL_API_URL: "https://rootinglabs.com"
    RL_SCAN_MODE: "standard"
    RL_FAIL_ON: "high"
    RL_SARIF_FILE: "rootinglabs.sarif"
    RL_WAIT: "true"
    RL_TIMEOUT_MINUTES: "60"
  before_script:
    - apk add --no-cache bash curl jq coreutils
  script:
    - export RL_TOKEN="$ROOTINGLABS_TOKEN"
    - export RL_TARGET="${RL_TARGET}"
    - bash scan.sh
  artifacts:
    when: always
    paths:
      - rootinglabs.sarif
  allow_failure: false   # set true to report without blocking the pipeline
